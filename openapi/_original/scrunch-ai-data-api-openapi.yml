          type: string
          description: ULID identifier for the connection.
        brand_id:
          type: integer
        website:
          type: string
          description: Hostname or URL of the website whose referrals are pushed against this connection.
        provider:
          type: string
          description: 'Source analytics provider. MVP allow-list: ''adobe_analytics''.'
          example: adobe_analytics
        status:
          type: string
          enum:
          - active
          - disabled
        created_at:
          type: string
          format: date-time
        last_pushed_at:
          type:
          - string
          - 'null'
          format: date-time
        last_push_error:
          type:
          - string
          - 'null'
      required:
      - id
      - brand_id
      - website
      - provider
      - status
      - created_at
    AiReferralsEvent:
      type: object
      description: One pre-aggregated daily referral row.
      required:
      - date
      - raw_referrer_value
      - raw_page_value
      properties:
        date:
          type: string
          format: date
          description: UTC calendar day the metrics cover.
          example: '2026-05-20'
        raw_referrer_value:
          type: string
          minLength: 1
          maxLength: 512
          description: Raw referrer value as emitted by the source analytics tool (e.g. 'chatgpt.com').
            Normalized server-side against the AI platform allow-list.
          example: chatgpt.com
        raw_page_value:
          type: string
          minLength: 1
          maxLength: 2048
          description: Raw page identifier from the source tool (URL path for GA4-shape tools; page name
            for Adobe unless a URL eVar is configured).
          example: /blog/launch-notes
        pageviews:
          type:
          - integer
          - 'null'
          minimum: 0
        sessions:
          type:
          - integer
          - 'null'
          minimum: 0
        transactions:
          type:
          - integer
          - 'null'
          minimum: 0
        purchase_revenue:
          type:
          - number
          - 'null'
          minimum: 0
        batch_id:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Optional client-supplied batch identifier for traceability.
    AiReferralsSaveResult:
      type: object
      description: Outcome of a push batch submission.
      required:
      - accepted
      - rejected
      properties:
        accepted:
          type: integer
          description: Number of events accepted into the unified referrals store.
        rejected:
          type: integer
          description: Number of events dropped (e.g. referrer not on the AI platform allow-list).
        errors:
          type: array
          items:
            type: string
          description: Per-row diagnostic messages, truncated.
    AiReferralsConnectionCreate:
      type: object
      description: Payload to register a new AI Referrals connection.
      required:
      - website
      - provider
      properties:
        website:
          type: string
          minLength: 1
          maxLength: 2048
          description: Hostname or URL of the website whose referrals will be pushed.
          example: example.com
        provider:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Source analytics provider. MVP allow-list: ''adobe_analytics''.'
          example: adobe_analytics
    AXPBulkRenderRequest:
      properties:
        paths:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 2048
          minItems: 1
          maxItems: 100
          title: Paths
          description: Paths on the site to render. Each entry is trimmed and given a leading slash if
