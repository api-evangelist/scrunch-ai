        Only fields present in the request body are updated. Omitted fields are left unchanged.

        For competitors and personas, the provided list replaces the current state:

        existing records not included in the list are archived.


        When you submit a persona without an `id` and its `name` matches a previously archived persona
        on the same brand, the archived persona is reactivated (its `status` returns to `active` and its
        `description` is updated) rather than creating a duplicate.'
