  /orchestration/render-bulk/{brand_id}/sites/{site_id}:
    post:
      tags:
      - axp-render
      summary: Bulk Render Optimized Pages
      description: 'Queue render jobs for a list of paths on a registered AXP site. Each path is fetched,
        sanitized, and persisted as an AXP optimized page asynchronously, so the endpoint returns immediately
        with one job entry per input path.


        Paths are normalized (trimmed and given a leading slash) and deduplicated before queueing. A path
        that already has an in-flight job on the same site coalesces onto that job, so the same batch
        can be retried safely. Inputs are capped at 100 paths per call.'
      operationId: bulkRenderOptimizedPages
      parameters:
      - name: brand_id
        in: path
        required: true
        schema:
          type: integer
          title: Brand Id
          description: The unique identifier for the brand that owns the site.
        description: The unique identifier for the brand that owns the site.
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          title: Site Id
          description: The ULID of the registered AXP site to render pages on.
        description: The ULID of the registered AXP site to render pages on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AXPBulkRenderRequest'
      responses:
        '200':
          description: One item per unique path with the queued job id and current status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AXPBulkRenderItem'
                title: AXPBulkRenderResponse
        '400':
          description: Site is not active for AXP or has no domain configured.
        '404':
          description: Site not found for the supplied brand.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '502':
          description: Render jobs were queued but at least one Inngest dispatch failed. Pending jobs
            are marked failed; retry the affected paths.
      security:
      - HTTPBearer:
        - configure
      servers:
      - url: https://api.scrunchai.com/v2
