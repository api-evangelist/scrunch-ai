    Assistant:
      properties:
        name:
          type: string
          title: Name
          description: The name of the assistant, such as ChatGPT or Perplexity.
        does_training:
          type: boolean
          title: Does Training
          description: Whether the assistant operates its own training data collection. Excludes assistants
            that use models from other providers or that train on third party corpuses, such as CommonCrawl.
        does_retrieval:
          type: boolean
          title: Does Retrieval
          description: Whether the assistant can retrieve web content.
        does_search_indexing:
          type: boolean
          title: Does Search Indexing
          description: Whether the assistant can search the web.
        can_cite:
          type: boolean
          title: Can Cite
          description: Whether the assistant can cite web content.
        search_agents:
          items:
            $ref: '#/components/schemas/UserAgent'
          type: array
          title: Search Agents
          default: []
        retrieval_agents:
          items:
            $ref: '#/components/schemas/UserAgent'
          type: array
          title: Retrieval Agents
          default: []
        training_agents:
          items:
            $ref: '#/components/schemas/UserAgent'
          type: array
          title: Training Agents
          default: []
      type: object
      required:
      - name
      - does_training
      - does_retrieval
      - does_search_indexing
      - can_cite
      title: Assistant
      description: 'Represents an AI assistant, such as ChatGPT or Perplexity. We care primarily about
        assistants that can do web searches and return citations.

        In order for a web page to be citable by an assistant, it must be indexable by a search user agent
        and retrievable by a retrieval user agent.'
    UserAgent:
      properties:
        identifier:
          type: string
          title: Identifier
          description: The robots.txt control identifier for the user agent, such as Googlebot or ChatGPT-User.
            This does not necessarily match the user agent string one would see in logs.
        sample_user_agent:
          type: string
          title: Sample User Agent
          description: A sample user agent string that could be found in logs -- the actual HTTP user
            agent string that would be sent to the server.
        owner:
          type: string
          enum:
          - Google
          - Bing
          - Perplexity
          - OpenAI
          - Amazon
          - Apple
          - CommonCrawl
          - DuckDuckGo
          - Anthropic
          - Meta
          title: Owner
          description: The owner of the user agent, such as Google or OpenAI.
        purposes:
          items:
            type: string
            enum:
            - Search Indexing
            - Training Data Collection
            - Retrieval
            - Other
          type: array
          uniqueItems: true
          title: Purposes
          description: The purposes of the user agent, such as Search Indexing or Retrieval.
        critical:
          type: boolean
          title: Critical
          description: Whether allowing this user agent is critical to the site being findable/citable
            by search engines or AI assistants. If it is, we want to ensure it is allowed.
          default: false
        collects_training_data:
          type: boolean
          title: Collects Training Data
          readOnly: true
      type: object
      required:
      - identifier
      - sample_user_agent
      - owner
      - purposes
      - collects_training_data
      title: UserAgent
      description: 'Represents a programmatic user agent, such as a search indexer or content retriever.

        For example: Googlebot or ChatGPT-User.'
