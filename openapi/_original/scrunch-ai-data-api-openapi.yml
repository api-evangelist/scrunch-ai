  /{brand_id}/prompts:
    post:
      summary: Create Prompt
      description: 'Creates a new prompt with variants for the specified platforms. Requires the `configure`
        scope.


        **Behavior:**

        - `stage` is optional. If omitted, the journey stage is auto-classified against your brand''s
        active stages using an LLM.

        - If `stage` is provided, it must match one of your brand''s active stages (case-sensitive display
        name). An unknown value returns `400`. An explicit stage is treated as a manual assertion and
        won''t be overwritten by later re-classification.

        - Creates variants for each specified platform.

        - Reactivates an archived prompt if a duplicate exists.

        - Dispatches collection events to begin tracking.'
      operationId: createPrompt
      parameters:
      - name: brand_id
        in: path
        required: true
        schema:
          type: integer
          description: The unique identifier for the brand
          title: Brand Id
        description: The unique identifier for the brand
      requestBody:
        required: true
        content:
