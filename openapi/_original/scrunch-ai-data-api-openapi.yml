  /brands/{brand_id}:
    patch:
      summary: Update Brand
      description: 'Partially update a brand. Only fields included in the request body are modified. For
        competitors and personas, the provided list represents the full desired state: include an `id`
        to update an existing record, omit `id` to create a new one, and any existing records not in the
        list are archived.


        If you submit a persona without an `id` and its `name` matches a previously archived persona on
        the same brand, the archived persona is reactivated (its `status` returns to `active` and its
        `description` is updated) instead of creating a duplicate. This avoids unique-name conflicts when
        reusing a name that was previously archived.'
      operationId: patchBrand
      parameters:
      - name: brand_id
        in: path
        required: true
        schema:
          type: integer
          title: Brand Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIBrandPatchInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIBrandListing'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer:
        - configure
