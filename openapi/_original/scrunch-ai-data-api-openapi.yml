openapi: 3.1.0
info:
  title: Scrunch Data API
  version: 0.1.0
servers:
- url: https://api.scrunchai.com/v1
paths:
  /{brand_id}/sites/{site_id}/agent-traffic:
    get:
      tags:
      - agent-traffic
      summary: Get Agent Traffic
      description: 'Retrieve aggregated bot and AI agent traffic data for a specific site.


        This endpoint provides visibility into how AI agents and bots are accessing your web properties.
        Use it to analyze traffic patterns, identify top agents, and understand crawl behavior over time.


        ## Available Dimensions


        The following dimensions can be included in the `fields` parameter to group results:


        | Field | Description |

        |-------|-------------|

        | `date` | Daily timestamp for the traffic record |

        | `site` | The site domain being analyzed |

        | `path` | URL path on the site |

        | `agent_source` | The source/origin of the agent (e.g., OpenAI, Google, Anthropic) |

        | `agent_type` | Classification of the agent type |


        ## Metrics


        Traffic counts are automatically included in the response based on the selected dimensions.'
      operationId: getAgentTraffic
      parameters:
      - name: brand_id
        in: path
        required: true
        schema:
          type: integer
          title: Brand Id
      - name: site_id
        in: path
        required: true
        schema:
          anyOf:
          - type: string
            minLength: 26
            maxLength: 26
            pattern: '[0-7][0123456789ABCDEFGHJKMNPQRSTVWXYZ]{25}'
          - type: string
            format: binary
            minLength: 16
            maxLength: 16
          description: The unique identifier of the site to retrieve agent traffic for.
          title: Site Id
        description: The unique identifier of the site to retrieve agent traffic for.
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: 'Start date for the query range (inclusive). Format: YYYY-MM-DD.'
          title: Start Date
        description: 'Start date for the query range (inclusive). Format: YYYY-MM-DD.'
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: 'End date for the query range (inclusive). Format: YYYY-MM-DD.'
          title: End Date
        description: 'End date for the query range (inclusive). Format: YYYY-MM-DD.'
      - name: fields
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Comma-separated list of dimensions to include in the response. Available dimensions:
            `date`, `site`, `path`, `agent_source`, `agent_type`. If not specified, returns aggregated
            totals.'
          title: Fields
        description: 'Comma-separated list of dimensions to include in the response. Available dimensions:
          `date`, `site`, `path`, `agent_source`, `agent_type`. If not specified, returns aggregated totals.'
      - name: time_bucket
        in: query
        required: false
        schema:
          enum:
          - day
          - week
          type: string
          description: 'Time aggregation bucket for grouping results. Options: `day`, `week`, `month`.
            Defaults to `day`.'
          default: day
          title: Time Bucket
        description: 'Time aggregation bucket for grouping results. Options: `day`, `week`, `month`. Defaults
          to `day`.'
      - name: path
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter results to a specific URL path or path prefix.
          title: Path
        description: Filter results to a specific URL path or path prefix.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100000
          minimum: 1
          description: Maximum number of rows to return. Use with offset for pagination.
          default: 10000
          title: Limit
        description: Maximum number of rows to return. Use with offset for pagination.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of rows to skip before returning results. Use with limit for pagination.
          default: 0
          title: Offset
        description: Number of rows to skip before returning results. Use with limit for pagination.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTrafficResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer:
        - query
  /{brand_id}/ai-referrals/connections/{connection_id}:
    delete:
      tags:
      - ai-referrals
      summary: Disable AI Referrals Connection
      description: Soft-disable a connection. Previously pushed events are retained but further pushes
        are rejected with `410 Gone` and the dashboard stops reading from this connection.
      operationId: disableAiReferralsConnection
      parameters:
      - name: brand_id
        in: path
        required: true
        schema:
          type: integer
          title: Brand Id
        description: The unique identifier for the brand.
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          title: Connection Id
        description: The ULID of the AI Referrals connection.
      responses:
        '200':
          description: Connection disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReferralsConnection'
        '404':
          description: Connection not found for this brand.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer:
        - configure
  /{brand_id}/ai-referrals/connections:
    get:
      tags:
      - ai-referrals
      summary: List AI Referrals Connections
      description: List AI Referrals push connections registered for this brand. Scope is limited to push
        connections only — Google Analytics integrations live in a separate system and are not returned
        here, even though they can block a register call with `409`.
      operationId: listAiReferralsConnections
      parameters:
      - name: brand_id
        in: path
        required: true
        schema:
          type: integer
          title: Brand Id
        description: The unique identifier for the brand.
      responses:
        '200':
          description: List of connections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiReferralsConnection'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer:
        - query
    post:
      tags:
      - ai-referrals
      summary: Register AI Referrals Connection
      description: 'Register an AI Referrals push connection for a (brand, website, provider) tuple. Events
        can only be pushed once a connection exists.


        A brand cannot have both a Google Analytics integration and an active AI Referrals push connection
        for the same website — the conflicting integration must be disabled first.


        MVP provider allow-list: `adobe_analytics`.'
      operationId: registerAiReferralsConnection
      parameters:
      - name: brand_id
        in: path
        required: true
        schema:
          type: integer
          title: Brand Id
        description: The unique identifier for the brand.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiReferralsConnectionCreate'
      responses:
        '201':
          description: Connection registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReferralsConnection'
        '400':
          description: Invalid provider or payload.
        '409':
          description: A connection or conflicting integration already exists for this (brand, website).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer:
        - configure
  /{brand_id}/ai-referrals/connections/{connection_id}/events:
    post:
      tags:
      - ai-referrals
      summary: Push AI Referrals Events
      description: 'Push a batch of pre-aggregated daily AI-referral events for a registered connection.


        Accepts `application/json` (a JSON array of events) or `application/x-ndjson` (one event per line).
        The upsert key is `(date, raw_referrer_value, raw_page_value)` — re-sending the same tuple replaces
        the prior values, so backfills and corrections are safe to retry.


        Limits:

        - Maximum 10,000 events per batch.

        - Maximum 5 MB request body.'
      operationId: pushAiReferralsEvents
      parameters:
      - name: brand_id
        in: path
        required: true
        schema:
          type: integer
          title: Brand Id
        description: The unique identifier for the brand.
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          title: Connection Id
        description: The ULID of the AI Referrals connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AiReferralsEvent'
          application/x-ndjson:
            schema:
              type: string
              description: Newline-delimited JSON, one event object per line.
      responses:
        '200':
          description: Batch accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReferralsSaveResult'
        '400':
          description: Malformed payload (invalid JSON, empty body, unexpected shape).
        '404':
          description: Connection not found for this brand.
        '410':
          description: Connection is disabled; re-register before retrying.
        '413':
          description: Payload too large (over 10,000 events or 5 MB).
        '422':
          description: One or more events failed validation.
      security:
      - HTTPBearer:
        - configure
