aid: scrunch-ai
name: Scrunch AI
description: >-
  Scrunch AI (scrunch.com) is an AI customer experience platform for AI search visibility
  and optimization - often called Answer Engine Optimization (AEO/GEO). It monitors and
  optimizes how a brand shows up across AI assistants and answer engines (ChatGPT,
  Perplexity, Claude, Gemini, Google AI Overviews, Copilot): tracking brand presence,
  position, sentiment, citations, and competitor share of voice; measuring AI bot and
  agent crawl traffic; auditing pages for AI search readiness; and running an
  Optimize-and-Deploy pipeline that audits, optimizes, and publishes machine-readable
  page versions through its Agent Experience Platform (AXP). Scrunch exposes a REST Data
  API (api.scrunchai.com/v1, Bearer API keys with query/configure/create-brand scopes), a
  hosted MCP server ("Scrunchie") for Claude, ChatGPT, Cursor and other clients, and Looker
  Studio / Data Studio connectors. The Data API also exposes a Signals surface - a nightly
  detection sweep of statistically-tested level changes and trends, with stable signal
  fingerprints and team reactions. Backed by Homebrew and Mayfield; acquired by Sitecore
  in June 2026 and operating as a standalone platform.
