mcp_only:
- tool: generate_explorer_chart
  reason: >
    Builds a Scrunch Explorer chart spec and returns a deep link into the app. No public
    REST operation creates Explorer charts.
- tool: create_explorer_dashboard
  reason: >
    Saves an Explorer dashboard of metric tiles and returns a deep link. The runtime spec's
    createCollection is not documented as the dashboard endpoint, so no binding is asserted.
- tool: get_response
  reason: >
    Fetches a single AI response by ID. The REST surface publishes listResponses only -
    there is no getResponse operation in either spec.
- tool: unarchive_prompt
  reason: REST publishes archivePrompt but no unarchive operation.
- tool: get_tags
  reason: No REST operation exposes the brand tag list; tags appear only as fields on prompts.
- tool: add_tag_to_prompts
  reason: Bulk tag append across up to 500 prompts; no public REST operation.
- tool: remove_tag_from_prompts
  reason: Bulk tag removal; no public REST operation.
- tool: update_persona_on_prompts
  reason: >
    Reassigns a persona across prompts. updatePersona edits the persona record itself, not
    its assignment across prompts, so no binding is asserted.
- tool: import_agent_traffic
  reason: >
    Ingests agent traffic. The documented ingestion endpoint is POST
    https://webhooks.scrunchai.com/v1/sites/{site_id}/platforms/custom/web-traffic, which
    sits on a different host and appears in no OpenAPI document, so it has no operationId
    to bind to.
