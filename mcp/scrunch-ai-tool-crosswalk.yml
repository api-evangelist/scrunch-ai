  reason: Scrunch help-center content; not part of the Data API.
- tool: get_scrunch_help_article
  reason: Scrunch help-center content; not part of the Data API.
- tool: fetch_scrunch_url
  reason: Server-side fetch of a Scrunch app/deep-link URL; no REST equivalent.
- tool: get_caller_identity
  reason: >
    Returns the authenticated MCP caller's identity. The REST surface has only root__get,
    which is an unlabelled root probe, not an identity endpoint.
- tool: get_current_date
  reason: Server-side clock utility for relative date phrasing; not an API capability.
