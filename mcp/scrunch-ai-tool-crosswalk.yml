  inputSchema was retrievable from the server. Tool names and descriptions are taken
  verbatim from the provider's published tool reference; the REST bindings are mapped by
  name and documented semantics against operationIds verified to exist in
  openapi/_original/scrunch-ai-data-api-runtime-openapi.json and
  openapi/_original/scrunch-ai-data-api-openapi.yml. Confidence is set honestly - nothing
  here was fabricated, and the four metrics tools bind to the single query operation
  because that is what the docs describe them as projecting.
