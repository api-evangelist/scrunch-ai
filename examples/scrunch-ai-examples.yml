- name: First Query API request - weekly brand presence
  operation: query
  spec: openapi/scrunch-ai-query-api-openapi.yml
  docs: https://developers.scrunch.com/getting-started/quickstart-query
  request:
    lang: curl
    code: |
      curl "https://api.scrunchai.com/v1/$SCRUNCH_BRAND_ID/query?fields=date_week,brand_presence_percentage&start_date=2025-01-01&end_date=2025-01-31" \
        -H "Authorization: Bearer $SCRUNCH_API_KEY" \
        -H "Accept: application/json"
  response:
    status: 200
    media_type: application/json
    body: |
      {
        "total": 4,
        "limit": 1000,
        "offset": 0,
        "rows": [
          { "date_week": "2025-01-06", "brand_presence_percentage": 42.1 },
          { "date_week": "2025-01-13", "brand_presence_percentage": 47.8 }
        ]
      }
- name: Query API request in Python
  operation: query
  docs: https://developers.scrunch.com/getting-started/quickstart-query
  request:
    lang: python
    code: |
      import requests
      import pandas as pd

      API_KEY = "your-api-key"
      BRAND_ID = "your-brand-id"
      BASE_URL = f"https://api.scrunchai.com/v1/{BRAND_ID}/query"

      params = {
          "fields": "date_week,brand_presence_percentage",
          "start_date": "2025-01-01",
          "end_date": "2025-01-31",
      }

      response = requests.get(
          BASE_URL,
          headers={"Authorization": f"Bearer {API_KEY}"},
          params=params,
          timeout=30,
      )
      response.raise_for_status()

      data = response.json()
      df = pd.DataFrame(data)
      print(df)
- name: Authenticate and list brands
  operation: listBrands
  spec: openapi/scrunch-ai-brands-api-openapi.yml
  docs: https://developers.scrunch.com/getting-started/authentication
  request:
    lang: curl
    code: |
      export SCRUNCH_API_TOKEN="your-key"

      curl -H "Authorization: Bearer $SCRUNCH_API_TOKEN" \
        https://api.scrunchai.com/v1/brands
