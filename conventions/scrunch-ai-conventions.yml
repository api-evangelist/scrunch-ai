token_identity:
  note: >
    Two distinct caller identities exist. API keys are organization-scoped machine
    credentials and carry no user identity: the Signals reaction writes
    (setSignalReaction, clearSignalReaction) require a user token (JWT) and return 403 to
    an API key. Documented at /api-reference/signals/overview.
